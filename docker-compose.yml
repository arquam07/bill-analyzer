services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bill
      POSTGRES_PASSWORD: bill
      POSTGRES_DB: bill_analyzer
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bill -d bill_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://bill:bill@postgres:5432/bill_analyzer
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcloud_adc.json
      GOOGLE_CLOUD_PROJECT: bill-analyzer07
      LOG_LEVEL: INFO
      APP_ENV: dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic
      - ./backend/storage:/app/storage
      - ${APPDATA}/gcloud/application_default_credentials.json:/tmp/gcloud_adc.json:ro

volumes:
  pgdata:
